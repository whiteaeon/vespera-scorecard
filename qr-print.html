<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vespera — Tester QR Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --aubergine: #3B2742;
      --gold: #C2A15C;
      --sage: #8FA68A;
      --bone: #F4EFE6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
    }

    .card {
      background: var(--bone);
      border: 2px solid var(--aubergine);
      border-radius: 16px;
      padding: 2.5rem 2.75rem 2.25rem;
      text-align: center;
      width: 380px;
    }

    .wordmark {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      letter-spacing: 0.25em;
      color: var(--aubergine);
      text-transform: uppercase;
    }

    .descriptor {
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
      margin-top: 0.1rem;
      font-weight: 600;
    }

    .rule {
      border: none;
      border-top: 1px solid var(--gold);
      margin: 1.25rem auto;
      width: 60%;
    }

    .headline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem;
      color: var(--aubergine);
      margin-bottom: 0.3rem;
      font-style: italic;
    }

    .sub {
      font-size: 0.72rem;
      color: #777;
      letter-spacing: 0.03em;
      margin-bottom: 1.25rem;
    }

    .qr-wrap {
      background: #fff;
      border-radius: 10px;
      display: inline-block;
      padding: 12px;
      border: 1px solid #ddd;
    }

    .qr-wrap img {
      display: block;
      width: 200px;
      height: 200px;
      image-rendering: pixelated;
    }

    .rule2 {
      border: none;
      border-top: 1px solid #ddd;
      margin: 1.25rem auto;
      width: 80%;
    }

    .url {
      font-size: 0.65rem;
      color: #999;
      letter-spacing: 0.02em;
      word-break: break-all;
    }

    .tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.85rem;
      color: var(--sage);
      margin-top: 1rem;
      font-style: italic;
    }

    @media print {
      body { background: #fff; min-height: unset; }
      .card { border-color: #3B2742; page-break-inside: avoid; }
    }
  </style>
</head>
